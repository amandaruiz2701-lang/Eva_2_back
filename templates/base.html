{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %} {% endblock %}</title>
    <!-- Bootstrap 5 CSS limpio sin bloqueos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #FDFBF7;
        }
        .navbar-hadasalon {
            background-color: #CCD5AE !important;
        }
        .btn-hadasalon-main {
            background-color: #588157;
            color: white;
        }
        .btn-hadasalon-main:hover {
            background-color: #3A5A40;
            color: white;
        }
        .btn-hadasalon-accent {
            background-color: #E5989B;
            color: white;
        }
        .btn-hadasalon-accent:hover {
            background-color: #B5838D;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-hadasalon shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="{% url 'inicio' %}">🌿 HadaSalon</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link px-3 fw-semibold" href="{% url 'inicio' %}">Inicio</a>
                <a class="nav-link px-3 fw-semibold" href="{% url 'citas' %}">Agenda</a>
                <a class="nav-link px-3 fw-semibold" href="{% url 'nosotros' %}">Nosotros</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                {% block contenido %} {% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS limpio sin bloqueos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
