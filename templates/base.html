<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HadaSalon | Belleza & Bienestar</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Tipografía elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fcf9fa; /* Fondo crema rosado muy suave */
            color: #4a4a4a;
        }
        .navbar-hada {
            background-color: #d8e2dc; /* Verde salvia pastel */
            border-bottom: 2px solid #ece4db;
        }
        .navbar-brand {
            color: #52796f !important;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }
        .nav-link {
            color: #354f52 !important;
            font-weight: 600;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: #b5838d !important; /* Rosa antiguo al pasar el mouse */
        }
        .btn-hada-primary {
            background-color: #84a98c;
            border-color: #84a98c;
            color: white;
            font-weight: 600;
            border-radius: 25px;
            padding: 10px 25px;
            transition: all 0.3s ease;
        }
        .btn-hada-primary:hover {
            background-color: #52796f;
            border-color: #52796f;
            color: white;
            transform: translateY(-2px);
        }
        .btn-hada-outline {
            border: 2px solid #b5838d;
            color: #b5838d;
            font-weight: 600;
            border-radius: 25px;
            padding: 10px 25px;
            transition: all 0.3s ease;
        }
        .btn-hada-outline:hover {
            background-color: #b5838d;
            color: white;
            transform: translateY(-2px);
        }
        .card-hada {
            border: none;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(181, 131, 141, 0.12);
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-hada shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">🌿 HadaSalon</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'citas' %}">Agenda</a>
                    </li>
                
                    {% if user.is_authenticated %}
                        <li class="nav-item ms-lg-3">
                            <span class="badge rounded-pill bg-light text-dark border px-3 py-2">
                                Hola, {{ user.username }} ✨
                            </span>
                        </li>
                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">Cerrar Sesión</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Iniciar Sesión</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-hada-primary btn-sm" href="{% url 'registro' %}">Registro</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico -->
    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
