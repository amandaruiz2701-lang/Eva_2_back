<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-5 shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Ingreso al sistema</h2>
                        <p class="text-center">Por favor, ingresa tus credenciales para iniciar sesión.</p>
                        <form method="POST">
                            {% csrf_token %}
                            <!--USUARIO-->
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" name="username" class="form-control" id="id_username" required>
                            </div>
                            <!--CONTRASEÑA-->
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="password" class="form-control" id="id_password" required>
                            </div>
                            <!--Mostrar error de autenticacion-->
                            {% if form.errors %}
                            <div class="alert alert-danger">
                                <strong>Usuario o contraseña incorrectos.</strong> Por favor, corrige los errores a
                                continuación.
                            </div>
                            {% endif %}
                            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
