{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Agendar Nueva Cita</h3>
                    
                    <!-- OJO: enctype es obligatorio para que funcionen las fotos (imagen_antes / imagen_despues) -->
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {{ formulario.as_p }}
                        
                        <button type="submit" class="btn btn-primary w-100 mt-3">Guardar Cita</button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <a href="{% url 'citas' %}" class="btn btn-secondary btn-sm">Volver al listado</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
