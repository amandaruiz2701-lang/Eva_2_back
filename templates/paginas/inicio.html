{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-9 text-center p-5 card-hada">
        <span class="badge rounded-pill mb-3 px-3 py-2" style="background-color: #f4acb7; color: white;">
            Estética & Cuidado Personal
        </span>
        <h1 class="display-4 fw-bold mb-3" style="color: #52796f;">¡Bienvenida a HadaSalon! 🌸</h1>

            Tu espacio ideal para la gestión profesional de citas, servicios de belleza y bienestar en un solo lugar.
        </p>
        <hr class="w-25 mx-auto my-4" style="border-top: 2px solid #b5838d;">

            <a href="{% url 'citas' %}" class="btn btn-hada-outline btn-lg">Ver Agenda</a>
